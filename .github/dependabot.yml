version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      androidx:
        patterns:
          - androidx.*
          - com.android.*

  - package-ecosystem: github-actions
    # The root covers .github/workflows only; the composite action needs its own entry.
    directories:
      - /
      - /.github/actions/setup-android-build
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
