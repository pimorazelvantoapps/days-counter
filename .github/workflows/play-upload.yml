name: Play upload

# Called by the release job for every new version. Run it by hand to retry a version whose
# upload failed after its tag was created; Play rejects a versionCode that was uploaded before.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Released version without the leading v, e.g. 1.2.3
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  upload:
    name: upload
    runs-on: ubuntu-latest
    environment: play-store
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ inputs.version }}
      - uses: ./.github/actions/setup-android-build

      - name: Decode upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # Without the configuration cache: it would store the key passwords on disk.
      - name: Build signed bundle
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease -PappVersion="$VERSION" --no-configuration-cache

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: com.pimorazelvanto.dayscounter
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          # Comma-separated Play tracks; alpha is the closed test that counts towards production access.
          tracks: ${{ vars.PLAY_TRACKS || 'alpha' }}
          # Until Google has reviewed the first release, the app is a draft and accepts only draft
          # releases; the repository variable PLAY_RELEASE_STATUS=draft covers that period.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          releaseName: v${{ inputs.version }}
          whatsNewDirectory: distribution/whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt
