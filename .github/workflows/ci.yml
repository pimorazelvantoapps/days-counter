name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android-build

      - run: ./gradlew check assembleDebug

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            app/build/reports/
            build/reports/detekt/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  connected:
    name: connected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android-build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Google's download of the system image intermittently breaks off ("Error on ZipFile
      # unknown archive"); sdkmanager skips the download when the cached image is present.
      - name: Cache emulator system image
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: system-image-android-34-google_apis-x86_64

      # A cached AVD with a boot snapshot lets the test run resume the emulator instead of
      # cold-booting it. The snapshot is generated once, only when the cache misses.
      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-android-34-google_apis-x86_64

      - name: Generate AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew connectedCheck assembleStaging
            scripts/smoke-test-minified.sh

      # connectedCheck reports success with zero tests when the app crashes before the runner
      # starts.
      - name: Fail if no instrumented test ran
        run: |
          grep -rqE 'tests="[1-9]' app/build/outputs/androidTest-results/connected/ ||
            { echo "connectedCheck ran no tests; did the app crash on start?" >&2; exit 1; }

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: connected-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, connected]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-android-build
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/exec@7.1.0
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release
