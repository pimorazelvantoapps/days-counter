name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Pull requests cancel their older runs. On main each run is its own group, so a newer merge can
  # cancel the older run's checks (job groups below) without ever touching a release in progress.
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6

  check:
    name: check
    concurrency:
      group: checks-${{ github.ref }}-check
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-android-build

      - run: ./gradlew -p buildSrc test

      - run: ./gradlew check assembleDebug

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: check-reports
          path: |
            app/build/reports/
            build/reports/detekt/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # The oldest supported Android and the newest available emulator image, where behaviour such as
  # edge-to-edge and test tooling differs most.
  emulator:
    name: emulator (API ${{ matrix.api-level }})
    concurrency:
      group: checks-${{ github.ref }}-emulator-${{ matrix.api-level }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-android-build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Google's download of the system image intermittently breaks off ("Error on ZipFile
      # unknown archive"); sdkmanager skips the download when the cached image is present.
      - name: Cache emulator system image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ matrix.api-level }}/google_apis/x86_64
          key: system-image-android-${{ matrix.api-level }}-google_apis-x86_64

      # A cached AVD with a boot snapshot lets the test run resume the emulator instead of
      # cold-booting it. The snapshot is generated once, only when the cache misses.
      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-android-${{ matrix.api-level }}-google_apis-x86_64

      - name: Generate AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew connectedCheck assembleStaging
            scripts/smoke-test-minified.sh

      # connectedCheck reports success with zero tests when the app crashes before the runner
      # starts.
      - name: Fail if no instrumented test ran
        run: |
          grep -rqE 'tests="[1-9]' app/build/outputs/androidTest-results/connected/ ||
            { echo "connectedCheck ran no tests; did the app crash on start?" >&2; exit 1; }

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: connected-reports-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  # The branch rules require a check named "connected"; it passes only if every emulator run did.
  connected:
    name: connected
    if: ${{ !cancelled() && needs.emulator.result != 'cancelled' }}
    needs: emulator
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.emulator.result }}" = success

  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, connected]
    # Never cancelled: a release that has started must finish its commit, tag and GitHub release.
    concurrency:
      group: release-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semantic-release.outputs.version }}
    steps:
      # The deploy key is the only actor the main ruleset lets push directly; semantic-release uses
      # it to push the release commit that carries version.properties.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: ./.github/actions/setup-android-build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*

      # Installed from the lockfile, so every release runs the same plugin code.
      - run: npm ci --prefix .github/release --ignore-scripts --no-audit --no-fund

      - name: Release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: .github/release/node_modules/.bin/semantic-release

  # Uploads only once Google Cloud is set up for this repository (docs/play-store-setup.md).
  play:
    name: play
    needs: release
    if: needs.release.outputs.version != '' && vars.GCP_SERVICE_ACCOUNT != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/play-upload.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  # Signed with the distribution key that GitHub, IzzyOnDroid and F-Droid share
  # (docs/fdroid-setup.md); skipped until that key exists.
  apk:
    name: apk
    needs: release
    if: needs.release.outputs.version != '' && vars.DISTRIBUTION_KEY_CONFIGURED == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/apk-release.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
