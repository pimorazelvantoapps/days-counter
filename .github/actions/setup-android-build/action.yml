name: Set up Android build
description: JDK, Gradle with cache and wrapper validation, and the SDK packages the project compiles against.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        distribution: temurin
        java-version: 21

    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

    - name: Install SDK platform and build tools
      shell: bash
      run: |
        # Process substitution instead of a pipe: under pipefail, `yes` dying of SIGPIPE once
        # sdkmanager exits would fail the step even when the installation succeeded.
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" < <(yes) > /dev/null
